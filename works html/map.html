<body class="project-detail-page map-detail-page">

        <img src="../image/redstar.png" alt="">

    <section class="map-graphic-gallery" aria-label="Map graphic design images">
        <img src="../image/map-graphics-web/mapgr1.jpg" data-full-src="../image/mapgr1.jpg" decoding="async" alt="Map graphic design 1" width="2048" height="2048" srcset="../image/project-web/mapgr1-1280.webp 1280w, ../image/project-web/mapgr1-2048.webp 2048w" sizes="100vw" loading="eager">
